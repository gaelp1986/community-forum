<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Forum</title>
</head>
<body>
  <header>
    <h1>Community Forum</h1>
    <p class="session-info">logged in as {{ username }} · <a href="{{ url_for('logout') }}">logout</a></p>
  </header>

  <main>
    <form method="POST" class="post-form">
      <textarea name="content" placeholder="Share something with the community..." required></textarea>
      <button type="submit">Post</button>
    </form>

    <section class="feed">
      {% for post in posts %}
        <article class="post">
          <p class="post-content">{{ post.content }}</p>
          <p class="post-meta">{{ post.username }} · {{ post.created_at }}</p>
        </article>
      {% else %}
        <p class="empty">No posts yet. Be the first to say something.</p>
      {% endfor %}
    </section>
  </main>
</body>
</html>
